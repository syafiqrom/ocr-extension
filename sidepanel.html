<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --primary: #1f5fa8;
            --on-primary: #ffffff;
            --primary-container: #d6e6ff;
            --on-primary-container: #001b3d;
            --surface: #f8f9fc;
            --surface-container: #eceef3;
            --card: #ffffff;
            --on-surface: #1a1c20;
            --on-surface-variant: #44474e;
            --outline: #74777f;
            --outline-variant: #c4c6d0;
            --error: #ba1a1a;
            --error-container: #ffdad6;
            --success: #1b6b3a;
            --success-container: #c8f0d4;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #a9c7ff;
                --on-primary: #00315e;
                --primary-container: #0a4784;
                --on-primary-container: #d6e6ff;
                --surface: #111318;
                --surface-container: #1e2025;
                --card: #1a1c21;
                --on-surface: #e3e2e9;
                --on-surface-variant: #c4c6d0;
                --outline: #8e9099;
                --outline-variant: #44474e;
                --error: #ffb4ab;
                --error-container: #93000a;
                --success: #8bd9a0;
                --success-container: #0c3b1e;
            }
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: system-ui, "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 14px;
            background: var(--surface);
            color: var(--on-surface);
        }

        .app-title {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 2px;
        }

        .app-sub {
            margin: 0 0 16px;
            color: var(--on-surface-variant);
        }

        /* ---- Status banner ---- */
        #status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            background: var(--primary-container);
            color: var(--on-primary-container);
            border-radius: 16px;
            font-weight: 500;
        }

        #status::before {
            content: "";
            flex: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
        }

        /* ---- Cards ---- */
        .card {
            background: var(--card);
            border: 1px solid var(--outline-variant);
            border-radius: 20px;
            padding: 14px 16px;
            margin-bottom: 12px;
        }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .card-head h3 {
            margin: 0;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--on-surface-variant);
        }

        /* count chip */
        .chip {
            min-width: 28px;
            padding: 2px 10px;
            border-radius: 999px;
            text-align: center;
            font-weight: 600;
            background: var(--surface-container);
            color: var(--on-surface);
        }

        .chip.pending {
            background: var(--primary-container);
            color: var(--on-primary-container);
        }

        .chip.done {
            background: var(--success-container);
            color: var(--success);
        }

        .chip.failed {
            background: var(--error-container);
            color: var(--error);
        }

        /* lists */
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
        }

        ul:empty::before {
            content: "Nothing here";
            display: block;
            padding: 8px 0;
            color: var(--outline);
        }

        li {
            padding: 10px 0;
            border-top: 1px solid var(--outline-variant);
            font-size: 15px;
            letter-spacing: 0.02em;
            font-variant-numeric: tabular-nums;
        }

        li:first-child {
            border-top: 0;
        }

        li.fail {
            color: var(--error);
        }

        /* ---- Buttons ---- */
        .actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        button {
            font: inherit;
            font-weight: 600;
            height: 40px;
            padding: 0 20px;
            border-radius: 999px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: filter 0.15s;
        }

        button:hover {
            filter: brightness(0.95);
        }

        button:active {
            filter: brightness(0.9);
        }

        .btn-filled {
            background: var(--primary);
            color: var(--on-primary);
        }

        .btn-outlined {
            background: transparent;
            color: var(--error);
            border-color: var(--outline);
        }

        .btn-text {
            background: transparent;
            color: var(--primary);
            padding: 0 12px;
        }

        /* ---- Setup screen: outlined text field ---- */
        .field {
            position: relative;
            margin: 8px 0 16px;
        }

        .field input {
            width: 100%;
            height: 56px;
            padding: 18px 16px 0;
            font: inherit;
            color: var(--on-surface);
            background: transparent;
            border: 1px solid var(--outline);
            border-radius: 12px;
            outline: none;
        }

        .field input:focus {
            border: 2px solid var(--primary);
            padding: 17px 15px 0;
        }

        .field label {
            position: absolute;
            left: 16px;
            top: 17px;
            color: var(--on-surface-variant);
            pointer-events: none;
            transition: all 0.15s;
        }

        .field input:focus+label,
        .field input:not(:placeholder-shown)+label {
            top: 7px;
            font-size: 11px;
            color: var(--primary);
        }

        #saveBtn {
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- First-run: enter secret code -->
    <div id="setup">
        <h1 class="app-title">DO Scanner</h1>
        <p class="app-sub">Enter the secret code shown in the phone app.</p>
        <div class="card">
            <div class="field">
                <input id="codeInput" type="password" placeholder=" " autocomplete="off">
                <label for="codeInput">Secret code</label>
            </div>
            <button id="saveBtn" class="btn-filled">Save</button>
        </div>
    </div>

    <!-- Main screen -->
    <div id="main" hidden>
        <h1 class="app-title">DO Scanner</h1>
        <p class="app-sub">Scanned numbers are ticked on the DO page automatically.</p>

        <div id="status">Starting…</div>

        <div class="card">
            <div class="card-head">
                <h3>Pending</h3><span id="pCount" class="chip pending">0</span>
            </div>
            <ul id="pList"></ul>
        </div>

        <div class="card">
            <div class="card-head">
                <h3>Done</h3><span id="dCount" class="chip done">0</span>
            </div>
            <ul id="dList"></ul>
        </div>

        <div class="card">
            <div class="card-head">
                <h3>Failed</h3><span id="fCount" class="chip failed">0</span>
            </div>
            <ul id="fList"></ul>
        </div>

        <div class="actions">
            <button id="clearBtn" class="btn-outlined">Clear all</button>
            <button id="changeBtn" class="btn-text">Change secret code</button>
        </div>
    </div>

    <script src="settings.js"></script>
    <script src="sidepanel.js"></script>
</body>

</html>
